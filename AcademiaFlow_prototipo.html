<style>

  html, body { margin: 0; padding: 0; overscroll-behavior: none; }

  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 15px rgba(191,255,0,0.3); } 50% { box-shadow: 0 0 30px rgba(191,255,0,0.6); } }
  @keyframes dropdownIn { from { opacity: 0; transform: translateY(-8px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  
  .animate-slide-up { animation: slideUp 0.4s ease-out both; }
  .animate-fade-in { animation: fadeIn 0.3s ease-out both; }
  .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
  .animate-dropdown { animation: dropdownIn 0.2s ease-out both; }
  .animate-overlay { animation: overlayIn 0.15s ease-out both; }
  
  .gradient-text {
    background: linear-gradient(135deg, #BFFF00 0%, #88cc00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .glass {
    background: rgba(26, 26, 26, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
  }
  
  .card-hover { transition: transform 0.15s ease; }
  .card-hover:active { transform: scale(0.98); }
  
  .bg-grid {
    background-image: 
      linear-gradient(rgba(191,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(191,255,0,0.03) 1px, transparent 1px);

  }
  
  .hero-gradient {

  }
  
  input, textarea, select {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #fff;
    transition: all 0.2s;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #BFFF00;
    box-shadow: 0 0 0 3px rgba(191,255,0,0.1);
  }
  
  .tab-active { color: #BFFF00 !important; }
  .tab-active::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #BFFF00;
  }
  
  .tab-btn { position: relative; }
  
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .safe-top { padding-top: env(safe-area-inset-top, 0px); }
  
  button { font-family: inherit; cursor: pointer; }
  
  .menu-item {
    transition: background 0.15s ease;
  }
  .menu-item:hover {
    background: rgba(255,255,255,0.04);
  }
  .menu-item:active {
    background: rgba(255,255,255,0.08);
  }
  
  .avatar-btn {
    transition: all 0.2s ease;
    position: relative;
  }
  .avatar-btn:hover {
    transform: scale(1.05);
  }
  .avatar-btn.active {
    box-shadow: 0 0 0 2px #BFFF00;
  }

// ============ RENDER ============
function render() {
  try {
    const app = document.getElementById('app');
    if (!app) return;
    switch(state.currentView) {
      case 'login': app.innerHTML = renderLogin(); break;
      case 'dashboard': app.innerHTML = renderDashboard(); break;
      case 'workout': app.innerHTML = renderWorkoutView(); break;
      case 'workout-mode': app.innerHTML = renderWorkoutMode(); break;
      default: app.innerHTML = renderLogin();
    }
    attachEvents();
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('app').innerHTML = `<div style="padding:20px;color:red">Erro: ${e.message}</div>`;
  }
}

function generateQRData() {
  let rects = '';
  const seed = state.user.id.charCodeAt(0);
  for (let row = 0; row < 20; row++) {
    for (let col = 0; col < 20; col++) {
      if ((row < 7 && col < 7) || (row < 7 && col > 12) || (row > 12 && col < 7)) continue;
      if (((row * 7 + col * 13 + seed) % 3) === 0) {
        rects += `<rect x="${5 + col * 4.5}" y="${5 + row * 4.5}" width="4" height="4" fill="black"/>`;
      }
    }
  }
  return rects;
}

// ============ WORKOUT MODE ============
function renderWorkoutMode() {
  const workout = state.data.workouts.find(w => w.student_id === state.user.id);
  if (!workout) return '<div class="p-8 text-center">Sem ficha</div>';
  
  const totalSets = workout.exercises_json.reduce((s, e) => s + e.sets, 0);
  const completedSets = workout.exercises_json.reduce((s, e, idx) => {
    const key = `${workout.id}_${idx}`;
    return s + (state.data.completed_sets[key] || 0);
  }, 0);
  const progress = Math.round((completedSets / totalSets) * 100);
  
  return `
    <div class="min-h-screen bg-grid" style="background-color:#0a0a0a">
      <div class="safe-top"></div>
      
      <div class="sticky top-0 z-30 glass safe-top">
        <div class="px-5 py-3 flex items-center justify-between">
          <button id="btn-exit-mode" class="p-2 rounded-xl hover:bg-gray-800">
            ${icons.x}
          </button>
          <div class="text-center">
            <div class="text-[10px] text-gray-500 uppercase tracking-wider">Modo Treino</div>
            <div class="text-sm font-bold">${workout.title}</div>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full pulse-glow" style="background:#ef4444"></div>
            <span class="text-xs font-bold text-red-400" id="timer">00:00</span>
          </div>
        </div>
        
        <div class="h-1" style="background:#1a1a1a">
          <div id="mode-progress" class="h-full transition-all" style="width: ${progress}%;background:linear-gradient(to right,#BFFF00,#4ade80)"></div>
        </div>
      </div>

      <div class="px-5 py-4">
        <div class="text-center mb-5">
          <div class="text-5xl font-bold gradient-text mb-1">${progress}%</div>
          <div class="text-xs text-gray-500">${completedSets} de ${totalSets} séries concluídas</div>
        </div>

        <div class="space-y-3">
          ${workout.exercises_json.map((ex, idx) => {
            const key = `${workout.id}_${idx}`;
            const completed = state.data.completed_sets[key] || 0;
            const isCurrent = completed < ex.sets && (idx === 0 || (state.data.completed_sets[`${workout.id}_${idx-1}`] || 0) === workout.exercises_json[idx-1].sets);
            const isDone = completed === ex.sets;
            return `
              <div class="glass rounded-2xl p-4 ${isCurrent ? 'ring-2' : ''}" style="${isCurrent ? 'border-color:#BFFF00' : ''} ${isDone ? 'opacity:0.6' : ''}">
                <div class="flex items-start gap-3 mb-3">
                  <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:${isDone ? '#4ade80' : (isCurrent ? '#BFFF00' : '#1a1a1a')};color:${isDone || isCurrent ? '#0a0a0a' : '#6b7280'}">
                    ${isDone ? '✓' : idx + 1}
                  </div>
                  <div class="flex-1">
                    <div class="font-bold text-sm">${ex.name}</div>
                    <div class="text-xs text-gray-500">${ex.sets}×${ex.reps} • ${ex.load}</div>
                  </div>
                </div>
                
                <div class="flex gap-1.5">
                  ${Array(ex.sets).fill(0).map((_, setIdx) => {
                    const done = setIdx < completed;
                    return `
                      <button data-set="${key}_${setIdx}" class="set-btn flex-1 py-3 rounded-lg text-sm font-bold transition-all" style="background:${done ? '#BFFF00' : '#1a1a1a'};color:${done ? '#0a0a0a' : '#9ca3af'}">
                        ${done ? '✓' : `S${setIdx + 1}`}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${progress === 100 ? `
          <div class="mt-6 glass rounded-2xl p-6 text-center" style="border:2px solid #BFFF00">
            <div class="text-5xl mb-3">🏆</div>
            <h3 class="text-xl font-bold gradient-text mb-2">Treino concluído!</h3>
            <p class="text-sm text-gray-400 mb-4">Parabéns! Você arrasou hoje.</p>
            <button id="btn-finish-workout" class="w-full font-bold py-3 rounded-xl" style="background:#BFFF00;color:#0a0a0a">Finalizar</button>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

      const user = state.data.users.find(u => u.email === email);
      if (user) {
        state.user = user;
        state.currentView = 'dashboard';
        state.activeTab = 'home';
        state.showUserMenu = false;
        saveUser();
        render();
      } else {
        alert('Usuário não encontrado. Use um dos acessos rápidos.');
      }
    };
  }

  document.querySelectorAll('.quick-login').forEach(btn => {
    btn.onclick = () => {
      const role = btn.dataset.role;
      const user = state.data.users.find(u => u.role === role);
      if (user) {
        state.user = user;
        state.currentView = 'dashboard';
        state.activeTab = 'home';
        state.showUserMenu = false;
        saveUser();
        render();
      }
    };
  });

  // Avatar / User Menu
  const btnAvatar = document.getElementById('btn-avatar');
  if (btnAvatar) {
    btnAvatar.onclick = (e) => {
      e.stopPropagation();
      state.showUserMenu = !state.showUserMenu;
      render();
    };
  }

  // Menu overlay (close menu)
  const menuOverlay = document.getElementById('menu-overlay');
  if (menuOverlay) {
    menuOverlay.onclick = () => {
      state.showUserMenu = false;
      render();
    };
  }

  // Menu: Profile
  const menuProfile = document.getElementById('menu-profile');
  if (menuProfile) {
    menuProfile.onclick = () => {
      state.showUserMenu = false;
      alert(`👤 ${state.user.name}\n✉️ ${state.user.email}\n📱 ${state.user.phone}\n🎭 ${state.user.role}`);
      render();
    };
  }

  // Menu: Switch Account (TROCAR DE CONTA)
  const menuSwitch = document.getElementById('menu-switch-account');
  if (menuSwitch) {
    menuSwitch.onclick = () => {
      state.showUserMenu = false;
      state.user = null;
      state.currentView = 'login';
      state.activeTab = 'home';
      state.editingWorkout = null;
      saveUser();
      render();
    };
  }

  // Menu: Logout
  const menuLogout = document.getElementById('menu-logout');
  if (menuLogout) {
    menuLogout.onclick = () => {
      if (confirm('Deseja realmente sair?')) {
        state.showUserMenu = false;
        state.user = null;
        state.currentView = 'login';
        state.activeTab = 'home';
        state.editingWorkout = null;
        saveUser();
        render();
      }
    };
  }

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      if (tab) {
        state.activeTab = tab;
        state.showUserMenu = false;
        render();
      }
    };
  });

  // Student cards
  document.querySelectorAll('.student-card').forEach(btn => {
    btn.onclick = () => {
      const studentId = btn.dataset.student;
      const workout = state.data.workouts.find(w => w.student_id === studentId);
      state.editingWorkout = workout ? { ...workout, exercises_json: workout.exercises_json.map(e => ({...e})) } : { student_id: studentId, exercises_json: [] };
      state.currentView = 'workout';
      render();
    };
  });

  // New workout
  document.querySelectorAll('[data-action="new-workout"]').forEach(btn => {
    btn.onclick = () => {
      state.editingWorkout = { exercises_json: [] };
      state.currentView = 'workout';
      render();
    };
  });

  // Edit workout
  document.querySelectorAll('[data-edit-workout]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.editWorkout;
      const w = state.data.workouts.find(w => w.id === id);
      state.editingWorkout = { ...w, exercises_json: w.exercises_json.map(e => ({...e})) };
      state.currentView = 'workout';
      render();
    };
  });

  // Back
  const btnBack = document.getElementById('btn-back');
  if (btnBack) {
    btnBack.onclick = () => {
      state.currentView = 'dashboard';
      state.editingWorkout = null;
      render();
    };
  }

  // Add exercise
  const btnAddEx = document.getElementById('btn-add-exercise');
  if (btnAddEx) {
    btnAddEx.onclick = () => {
      state.editingWorkout.exercises_json.push({ name: '', sets: 3, reps: '10-12', load: '', rest: '60s', notes: '' });
      render();
    };
  }

  // Remove exercise
  document.querySelectorAll('[data-remove-exercise]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.removeExercise);
      state.editingWorkout.exercises_json.splice(idx, 1);
      render();
    };
  });

  // Exercise fields
  document.querySelectorAll('.ex-field').forEach(input => {
    input.oninput = () => {
      const card = input.closest('[data-exercise-idx]');
      if (!card) return;
      const idx = parseInt(card.dataset.exerciseIdx);
      const field = input.dataset.field;
      state.editingWorkout.exercises_json[idx][field] = field === 'sets' ? (parseInt(input.value) || 0) : input.value;
    };
  });

  // Save workout
  const btnSave = document.getElementById('btn-save-workout');
  if (btnSave) {
    btnSave.onclick = () => {
      const studentId = document.getElementById('f-student').value;
      const title = document.getElementById('f-title').value;
      if (!studentId || !title) {
        alert('Preencha aluno e título');
        return;
      }
      if (state.editingWorkout.exercises_json.length === 0) {
        alert('Adicione pelo menos um exercício');
        return;
      }
      
      if (state.editingWorkout.id) {
        const idx = state.data.workouts.findIndex(w => w.id === state.editingWorkout.id);
        state.data.workouts[idx] = {
          ...state.editingWorkout,
          student_id: studentId,
          title: title,
          updated_at: new Date().toISOString().split('T')[0]
        };
      } else {
        state.data.workouts.push({
          id: 'w' + Date.now(),
          tenant_id: 't1',
          student_id: studentId,
          trainer_id: state.user.id,
          title: title,
          exercises_json: state.editingWorkout.exercises_json,
          updated_at: new Date().toISOString().split('T')[0]
        });
      }
      state.currentView = 'dashboard';
      state.activeTab = 'workouts';
      state.editingWorkout = null;
      render();
    };
  }

  // Start workout
  const btnStart = document.getElementById('btn-start-workout');
  if (btnStart) {
    btnStart.onclick = () => {
      state.currentView = 'workout-mode';
      render();
      startWorkoutTimer();
      requestWakeLock();
    };
  }

  // Exit workout mode
  const btnExit = document.getElementById('btn-exit-mode');
  if (btnExit) {
    btnExit.onclick = () => {
      state.currentView = 'dashboard';
      state.activeTab = 'workout';
      stopWorkoutTimer();
      releaseWakeLock();
      render();
    };
  }

  // Finish workout
  const btnFinish = document.getElementById('btn-finish-workout');
  if (btnFinish) {
    btnFinish.onclick = () => {
      const workout = state.data.workouts.find(w => w.student_id === state.user.id);
      if (workout) {
        workout.exercises_json.forEach((_, idx) => {
          delete state.data.completed_sets[`${workout.id}_${idx}`];
        });
        saveData();
      }
      state.currentView = 'dashboard';
      state.activeTab = 'home';
      stopWorkoutTimer();
      releaseWakeLock();
      render();
    };
  }

  // Set buttons
  document.querySelectorAll('.set-btn').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.set;
      const parts = key.split('_');
      const wId = parts[0];
      const exIdx = parseInt(parts[1]);
      const sIdx = parseInt(parts[2]);
      
      const workout = state.data.workouts.find(w => w.id === wId);
      if (!workout) return;
      
      const currentKey = `${wId}_${exIdx}`;
      const current = state.data.completed_sets[currentKey] || 0;
      
      if (sIdx === current) {
        state.data.completed_sets[currentKey] = current + 1;
        if (navigator.vibrate) navigator.vibrate(30);
      } else if (sIdx < current) {
        state.data.completed_sets[currentKey] = sIdx;
      }
      
      saveData();
      render();
      
      if (state.currentView === 'workout-mode') startWorkoutTimer();
    };
  });

  // QR Timer
  if (state.activeTab === 'qr' && state.user && state.user.role === 'STUDENT') {
    startQRTimer();
  }
}

// Close menu on outside click (document level)
document.addEventListener('click', (e) => {
  if (state.showUserMenu) {
    const menu = document.getElementById('user-menu');
    const avatar = document.getElementById('btn-avatar');
    if (menu && !menu.contains(e.target) && (!avatar || !avatar.contains(e.target))) {
      state.showUserMenu = false;
      render();
    }
  }
});

// ============ TIMERS ============
let workoutTimerInterval = null;
let workoutStartTime = null;

function startWorkoutTimer() {
  stopWorkoutTimer();
  if (!workoutStartTime) workoutStartTime = Date.now();
  
  workoutTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - workoutStartTime) / 1000);
    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const secs = (elapsed % 60).toString().padStart(2, '0');
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = `${mins}:${secs}`;
  }, 1000);
}

function stopWorkoutTimer() {
  if (workoutTimerInterval) {
    clearInterval(workoutTimerInterval);
    workoutTimerInterval = null;
  }
  workoutStartTime = null;
}

let qrTimerInterval = null;
function startQRTimer() {
  if (qrTimerInterval) clearInterval(qrTimerInterval);
  let seconds = 60;
  const update = () => {
    const el = document.getElementById('qr-timer');
    if (!el) { clearInterval(qrTimerInterval); qrTimerInterval = null; return; }
    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
    const secs = (seconds % 60).toString().padStart(2, '0');
    el.textContent = `${mins}:${secs}`;
    seconds--;
    if (seconds < 0) {
      seconds = 60;
    }
  };
  update();
  qrTimerInterval = setInterval(update, 1000);
}

// ============ WAKE LOCK ============
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { console.log('Wake Lock not available'); }
}
async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch(e) {}
    wakeLock = null;
  }
}

// ============ INIT ============
try {
  render();
} catch(e) {
  console.error('Init error:', e);
  document.getElementById('app').innerHTML = `<div style="padding:20px;color:red">Erro: ${e.message}</div>`;
}

document.addEventListener('visibilitychange', () => {
  if (state.currentView === 'workout-mode' && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});
</script>
